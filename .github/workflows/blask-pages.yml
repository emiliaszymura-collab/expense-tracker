name: Blask — publikacja na GitHub Pages

# Publikuje aplikację jako prawdziwą stronę WWW (nie podgląd), na której
# zdjęcia produktów z Open Beauty Facts ładują się normalnie.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "cosmetics-price-compare/renderer/**"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: cosmetics-price-compare/renderer
      - id: deployment
        uses: actions/deploy-pages@v4
