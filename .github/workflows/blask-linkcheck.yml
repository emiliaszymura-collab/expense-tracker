name: Blask — test linków do sklepów

# Sprawdza w chmurze, czy adresy sklepów (wyszukiwarki) odpowiadają.
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Test linków
        run: node cosmetics-price-compare/sync/check-links.mjs
